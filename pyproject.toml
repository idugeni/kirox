[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kirox"
version = "1.0.0"
description = "Production-ready SDK for AI coding assistants with background service and system tray"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kirox Contributors" }]
keywords = ["ai", "coding-assistant", "llm", "sdk", "background-service", "kiro", "claude", "gpt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "Flask>=3.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
service = ["pystray>=0.19", "Pillow>=10.0", "APScheduler>=3.10"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
kirox = "kirox.cli:main"

[project.urls]
Homepage = "https://github.com/idugeni/kirox"
Documentation = "https://github.com/idugeni/kirox#readme"
Repository = "https://github.com/idugeni/kirox"
Issues = "https://github.com/idugeni/kirox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kirox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
