[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kirox"
dynamic = ["version"]
description = "Production-ready SDK for AI coding assistants with background service and system tray"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kirox Contributors" }]
keywords = ["ai", "coding-assistant", "llm", "sdk", "background-service", "kiro", "claude", "gpt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "Flask>=3.1.3,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
service = ["pystray>=0.19.5,<0.20", "Pillow>=12.3.0,<13"]
dev = [
    "build==1.5.0",
    "mypy==2.3.0",
    "pyrefly==1.2.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[project.scripts]
kirox = "kirox.cli:main"
kirox-mcp = "kirox.mcp.server:main"

[project.urls]
Homepage = "https://github.com/idugeni/kirox"
Documentation = "https://github.com/idugeni/kirox#readme"
Repository = "https://github.com/idugeni/kirox"
Issues = "https://github.com/idugeni/kirox/issues"

[tool.hatch.version]
path = "src/kirox/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kirox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["PIL.*", "numpy", "numpy.*", "pystray.*"]
follow_imports = "skip"
ignore_missing_imports = true

# An explicit section is required: without it Pyrefly falls back to the `basic`
# preset, which silences most type errors and makes a green run meaningless.
[tool.pyrefly]
preset = "default"
project-includes = ["src", "tests", "scripts"]
python-version = "3.10"
min-severity = "warn"
ignore-missing-imports = ["PIL", "PIL.*", "numpy", "numpy.*", "pystray", "pystray.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["kirox"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
